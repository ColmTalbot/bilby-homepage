# Checks pull requests (and, weekly, the live dependencies): the site builds,
# its links work, and every in-browser example still runs with the newest
# bilby under the configured Pyodide version.
#
# Actions are pinned to commit SHAs (the comment gives the release); Dependabot
# updates both together.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --root-dir "${{ github.workspace }}/_site"
            --exclude "doi\.org" --exclude "anaconda\.org"
            --exclude "^https://bilby-dev\.github\.io/?$"
            "_site/**/*.html"
          fail: true

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # PyYAML comes from requirements.txt; Pyodide's npm package is pinned to
      # the exact version the site uses (content/site.yaml).
      - run: pip install -r requirements.txt
      # Exact version from site.yaml (its single source of truth), no install scripts.
      - name: Install the Pyodide version the site uses
        run: | # zizmor: ignore[adhoc-packages]
          VERSION=$(python -c "import yaml; print(yaml.safe_load(open('content/site.yaml'))['pyodide']['version'])")
          npm install --no-save --ignore-scripts "pyodide@$VERSION"
      - run: node tests/run_examples.mjs
