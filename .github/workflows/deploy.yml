# Builds the site and publishes it to GitHub Pages.
# Repository settings: Pages > Build and deployment > Source = "GitHub Actions".
#
# Actions are pinned to commit SHAs (the comment gives the release); Dependabot
# updates both together.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily: picks up new releases and expires old announcements
  workflow_dispatch:
  repository_dispatch:
    types: [bilby-release] # sent by bilby's release workflow (see README)

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # --all also publishes every design under /preview/ while a design is chosen
      - run: python build.py --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Only this job can publish: the build job, which installs packages and
  # fetches data from the network, has read-only access.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
